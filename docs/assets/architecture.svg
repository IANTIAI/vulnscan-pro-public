<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">VulnScan Pro data flow</title><desc id="desc">Authorized targets flow through Nmap discovery and CVE enrichment into a local PDF report.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101c2b"/><stop offset="1" stop-color="#182a3a"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#44d7c4"/></marker></defs><rect width="1200" height="390" rx="24" fill="url(#bg)"/><text x="50" y="55" fill="#f4f8fc" font-family="Arial,sans-serif" font-size="25" font-weight="700">VulnScan Pro · Data flow</text><text x="50" y="83" fill="#a9bdce" font-family="Arial,sans-serif" font-size="15">Local inventory and CVE enrichment</text><g font-family="Arial,sans-serif"><g><rect x="48" y="130" width="245" height="138" rx="16" fill="#213a4a" stroke="#44d7c4"/><text x="70" y="169" fill="#44d7c4" font-size="13" font-weight="700">01 · SCOPE</text><text x="70" y="201" fill="#f4f8fc" font-size="18" font-weight="700">Authorized targets</text><text x="70" y="227" fill="#d0dce5" font-size="15">Entered by operator</text></g><path d="M300 199 H347" stroke="#44d7c4" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="360" y="130" width="245" height="138" rx="16" fill="#213a4a" stroke="#44d7c4"/><text x="382" y="169" fill="#44d7c4" font-size="13" font-weight="700">02 · DISCOVERY</text><text x="382" y="201" fill="#f4f8fc" font-size="18" font-weight="700">Nmap / services</text><text x="382" y="227" fill="#d0dce5" font-size="15">Hosts, ports, services</text><text x="382" y="250" fill="#a9bdce" font-size="12">Active checks</text></g><path d="M612 199 H659" stroke="#44d7c4" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="672" y="130" width="245" height="138" rx="16" fill="#213a4a" stroke="#44d7c4"/><text x="694" y="169" fill="#44d7c4" font-size="13" font-weight="700">03 · ENRICHMENT</text><text x="694" y="201" fill="#f4f8fc" font-size="18" font-weight="700">CVE · NVD · KEV · EPSS</text><text x="694" y="227" fill="#d0dce5" font-size="15">Review findings</text><text x="694" y="250" fill="#a9bdce" font-size="12">Public lookup by CVE ID</text></g><path d="M924 199 H971" stroke="#44d7c4" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="984" y="130" width="170" height="138" rx="16" fill="#213a4a" stroke="#44d7c4"/><text x="1006" y="169" fill="#44d7c4" font-size="13" font-weight="700">04 · OUTPUT</text><text x="1006" y="201" fill="#f4f8fc" font-size="18" font-weight="700">PDF / UI</text><text x="1006" y="227" fill="#d0dce5" font-size="15">Local</text><text x="1006" y="250" fill="#a9bdce" font-size="12">English</text></g></g><rect x="48" y="300" width="1106" height="54" rx="10" fill="#132333" stroke="#40576a"/><text x="68" y="324" fill="#f0c36c" font-family="Arial,sans-serif" font-size="13" font-weight="700">Note</text><text x="180" y="324" fill="#d0dce5" font-family="Arial,sans-serif" font-size="13">Findings are indicators. BSI mapping is not a full Grundschutz assessment or certification.</text></svg>